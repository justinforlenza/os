name: cache
# Builds what cache.nixos.org doesn't have (unfree apps, pkgs/, flake-input apps like Claude Desktop) and pushes it
# to the justinforlenza-os Cachix cache, so machines download it instead of building it themselves.
# A machine that upgrades before this finishes just builds those packages itself.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [flake.nix, flake.lock, "pkgs/**", "modules/**", "hosts/**"]
concurrency: # a newer push replaces a build still running
  group: cache
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner's free disk (~14 GB) runs out; this turns the space taken by unused preinstalled tools into /nix
      - uses: wimpysworld/nothing-but-nix@v12
      - uses: DeterminateSystems/nix-installer-action@v23
      # Also a substituter here, so what's already pushed counts as cached and isn't rebuilt
      - uses: cachix/cachix-action@v17
        with:
          name: justinforlenza-os
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: scripts/build-uncached
