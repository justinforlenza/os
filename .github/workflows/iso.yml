name: iso
# Builds the installer ISO and publishes it as a GitHub release: automatically when the installer or its
# packages change on main, or by hand from the Actions tab.
# Versions are CalVer YYYY.MM.DD, with .1, .2, ... added for extra releases on the same day.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [install.py, disko.nix, modules/iso.nix, flake.nix, flake.lock]
permissions:
  contents: write # create the tag and release
concurrency: # a newer push replaces a build still running
  group: iso
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to pick an unused version
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Pick version
        run: |
          base=$(date -u +%Y.%m.%d) ver=$base n=0
          while git rev-parse -q --verify "refs/tags/$ver" >/dev/null; do ver=$base.$((++n)); done
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: Build ISO
        run: |
          nix build .#nixosConfigurations.iso.config.system.build.isoImage -o result-iso
          cp -L result-iso/iso/*.iso "nixos-installer-$VERSION.iso"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" "nixos-installer-$VERSION.iso" \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
