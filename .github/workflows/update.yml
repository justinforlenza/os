name: update
# Weekly (and from the Actions tab): bump flake.lock, Helium and Proton VPN, check every host still evaluates, open a PR.
# Merging it = machines update on their next daily autoUpgrade (and iso.yml builds a new ISO).
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix flake update
      - run: scripts/update-helium
      - run: scripts/update-proton-vpn
      # Checks run here: a PR opened with GITHUB_TOKEN doesn't trigger check.yml
      - name: Evaluate hosts
        run: |
          for host in hosts/*/; do
            host=$(basename "$host")
            echo "::group::$host"
            nix eval ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
            echo "::endgroup::"
          done
      - name: Build Helium and Proton VPN # evaluating doesn't fetch them, so a bad hash or package would only show up on the machines
        run: |
          for p in ./pkgs/helium.nix ./pkgs/proton-vpn; do
            nix build --impure --no-link --expr "(import (builtins.getFlake \"path:$PWD\").inputs.nixpkgs {
              system = \"x86_64-linux\"; config.allowUnfree = true; }).callPackage $p { }"
          done
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: update
          delete-branch: true
          commit-message: Update flake.lock, Helium and Proton VPN
          title: Update flake.lock, Helium and Proton VPN
          body: Weekly update from the `update` workflow. Every host evaluated; Helium and Proton VPN built.
